[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "juling-local-renderer"
version = "0.3.0"
description = "Local renderer for Juling short-drama translation/dubbing packages"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juling" }]
license = { text = "MIT" }

[project.scripts]
juling-render = "juling_local_renderer.cli:main"
juling-render-gui = "juling_local_renderer.gui:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
